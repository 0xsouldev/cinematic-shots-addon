name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      # Uploaded unzipped, so the download is the .addon64 itself.
      - uses: actions/upload-artifact@v7
        with:
          path: build/Release/CinematicShots.addon64
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: shaders/CinematicLook.fx
          archive: false
          if-no-files-found: error

  effects:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install glslang and SPIRV-Tools
        run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools
      - name: Build fxcheck (ReShade 6.8.0's effect compiler)
        run: |
          cmake -S tools/fxcheck -B fxcheck-build -DCMAKE_BUILD_TYPE=Release
          cmake --build fxcheck-build --parallel
      - name: Check effects
        run: tools/fxcheck/check.sh fxcheck-build/fxcheck
