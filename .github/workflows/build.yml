name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      # Uploaded unzipped, so the download is the .addon64 itself.
      - uses: actions/upload-artifact@v7
        with:
          path: build/Release/CinematicShots.addon64
          archive: false
          if-no-files-found: error
